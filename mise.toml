[env]
# Household mail identity. Namecheap Private Email hosts stauros.family;
# mail.privateemail.com is the host whose TLS cert actually covers it
# (mail.stauros.family resolves to the same IP but is not on the cert).
# Templated so an explicit export still wins — tests pin their own values.
OIKOS_EMAIL_DOMAIN = "{{ env.OIKOS_EMAIL_DOMAIN | default(value='stauros.family') }}"
OIKOS_MAIL_HOST = "{{ env.OIKOS_MAIL_HOST | default(value='mail.privateemail.com') }}"

# Credential backend for `secrets`. 1Password on Linux (keychain is macOS-only);
# templated so tests and one-off overrides still win.
SECRETS_PROVIDER = "{{ env.SECRETS_PROVIDER | default(value='1password') }}"

[settings]
experimental = true
quiet = true
task_output = "interleave"
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[shell_alias]
header = '''printf '\n== %s ==\n''''

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
# Task runtimes and command-line utilities
"aqua:nushell/nushell" = "0.115.0"
"aqua:shenwei356/rush" = "0.9.0"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
gh = "2.98.0"
gum = "2.0.0"
jq = "1.8.2"
usage = "5.1.0"
yq = "4.53.6"

# Shared KKL packages
# desks and shell publish git tags but no GitHub releases, so shiv cannot
# resolve a partial version for them — pin the exact tag.
"shiv:chat" = "0.2"
"shiv:codebase" = "0.4"
"shiv:comments" = "0.3"
"shiv:desks" = "v0.1.2"
"shiv:emails" = "0.7"
"shiv:modules" = "0.9"
"shiv:notes" = "0.10"
"shiv:rudi" = "0.5"
# Running from a local shiv install of knack's fork until the libsecret
# provider lands upstream — see notes/agent-credentials.md. Restore this pin
# and `shiv remove secrets` to go back to the released package.
# "shiv:secrets" = "0.2"
"shiv:sessions" = "0.5"
"shiv:shell" = "v0.1.3"
# Floating on purpose, and load-bearing: the vfox-shiv nested-install deadlock
# (vfox-shiv#36) fires when a NEW release lands inside a floating range, so the
# machine-level mitigation is the exact pin in ~/.config/mise/config.toml
# ("shiv:shimmer" = "0.1.36"), which shadows this. Do not "fix" this line by
# pinning it here and dropping the global pin — the global one is the guard.
"shiv:shimmer" = "0.1"
"shiv:websites" = "0.1"

[_.codebase]
name = "oikos"
lint = ["mise-settings", "gum-table"]

[_.codebase.scope]
gum-table = ".mise/tasks"
